name: Build and Release

on:
  push:
    branches: [tmp/dry-run-sdk-workflow]

jobs:
  release:
    permissions:
      contents: write
    uses: msantoro12/StarRupture-Plugin-SDK/.github/workflows/plugin-release.yml@gss/sdk-release-workflow
    with:
      plugin_name: Codex
      solution_file: StarRupture-Plugin-Codex.sln
      release_title: Codex Plugin
      # Global (v3 API) id of the mod page: GET /v3/games/starrupture/mods/138 -> data.id
      nexus_mod_id: '37074157699210'
      sdk_repository: msantoro12/StarRupture-Plugin-SDK
      sdk_ref: gss/sdk-release-workflow
      dry_run: true
    secrets: inherit
